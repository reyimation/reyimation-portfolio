<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Reyimation</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<style>
  /* Shown by the service worker when the site is opened without a connection.
     No text: only the wordmark drawing on with the kit's exact timing. */
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: grid; place-items: center; }
  .wm { display: block; width: min(520px, 72vw); height: auto; overflow: visible; color: #fafaf7; }
  .wm .tri { fill: #ff4f1f; }
  .wm .dot { fill: currentColor; }
  .ltr { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s cubic-bezier(.6,0,.2,1) forwards; animation-delay: calc(.25s + var(--i) * .09s); }
  .tri { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: pop .55s cubic-bezier(.3,1.6,.5,1) forwards 1.55s; }
  .dot { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: pop .45s cubic-bezier(.3,1.6,.5,1) forwards 1.7s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop { to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .ltr, .tri, .dot { animation: none; stroke-dashoffset: 0; transform: none; } }
</style>
</head>
<body>
<svg class="wm" viewBox="-8 4 627 132" role="img" aria-label="reyimation"><g fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"><path class="ltr" d="M7 93 V70 A23 23 0 0 1 41.50 50.08" transform="translate(0 0)" pathLength="1" style="--i:0"/><path class="ltr" d="M7 70 H53 A23 23 0 0 0 7 70 A23 23 0 0 0 46.26 86.26" transform="translate(59 0)" pathLength="1" style="--i:1"/><path class="ltr" d="M7 47 L31.9 93 M53 47 L19 121" transform="translate(129 0)" pathLength="1" style="--i:2"/><path class="ltr" d="M7 47 V93" transform="translate(201 0)" pathLength="1" style="--i:3"/><path class="ltr" d="M7 93 V64 A17 17 0 0 1 41 64 V93 M41 64 A17 17 0 0 1 75 64 V93" transform="translate(229 0)" pathLength="1" style="--i:4"/><path class="ltr" d="M7 70 A23 23 0 1 0 53 70 A23 23 0 1 0 7 70 M53 47 V93" transform="translate(325 0)" pathLength="1" style="--i:5"/><path class="ltr" d="M18 16 V78 A15 15 0 0 0 33 93 H37 M5 47 H37" transform="translate(395 0)" pathLength="1" style="--i:6"/><path class="ltr" d="M7 47 V93" transform="translate(449 0)" pathLength="1" style="--i:7"/><path class="ltr" d="M7 70 A23 23 0 1 0 53 70 A23 23 0 1 0 7 70" transform="translate(477 0)" pathLength="1" style="--i:8"/><path class="ltr" d="M7 93 V70 A23 23 0 0 1 53 70 V93" transform="translate(551 0)" pathLength="1" style="--i:9"/></g><path class="tri" d="M203.0 17.0 L218.0 26.0 L203.0 35.0 Z"/><circle class="dot" cx="456" cy="26" r="8"/></svg>
<script>

  addEventListener("online", function () { location.reload(); });
